name: CI

# SECURITY: `pull_request`, never `pull_request_target`.
#
# `pull_request_target` runs with repository secrets in the context of the
# fork's code, which is the specific footgun that leaks secrets to untrusted
# pull requests. This workflow needs no secrets, so it must never be changed
# to that trigger — a PR doing so should be rejected on sight
# (dev plan BR-M0-02, BR-M7-05 review checklist step 3).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; jobs opt in to more only where required.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

# ORDERING RULE, do not reshuffle:
#
#   checkout  ->  setup-node  ->  corepack enable  ->  pnpm install
#
# `corepack enable` writes shims into the *current* Node installation's bin
# directory. Run before setup-node it targets the runner's system Node, which
# the runner user may not own (EACCES), and any shims it did write are then
# orphaned when setup-node swaps in a different Node.
#
# For the same reason `cache: pnpm` is not used on setup-node: that option
# needs pnpm on PATH to locate the store, which cannot be true before corepack
# has run. The pnpm store is cached explicitly instead, which has no such
# ordering constraint.

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the version the plan targets; 24 catches forward breakage
        # early rather than at an upgrade deadline.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Enable corepack
        run: corepack enable

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-node${{ matrix.node }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-node${{ matrix.node }}-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      # Test files are excluded from every package's build so they never land
      # in dist/ — which also meant nothing type-checked them: not `typecheck`,
      # not eslint's non-type-aware ruleset, not vitest's esbuild transpile.
      # Runs after `typecheck`, whose build produces the dist/ that the test
      # project's workspace imports resolve through.
      - name: Type-check the test suite
        run: pnpm exec tsc -p tsconfig.test.json

      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test
      - run: pnpm run build

      # The committed JSON Schemas are a published contract (build plan §23).
      # Regenerating and comparing means a change to the TypeScript
      # definitions cannot silently diverge from what consumers read.
      - name: Schemas match their TypeScript source
        run: pnpm run schemas:check

  # The milestone gate runs as its own job so a failure says "V1's claim
  # does not hold" rather than being one red line among thirteen hundred.
  # It also runs inside `verify`, which is what keeps it from rotting — a
  # gate only CI runs is a gate nobody notices breaking locally.
  gate:
    name: milestone gate (browser, headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      # The gate drives the CLI end to end, which needs the workspace built.
      - run: pnpm run build

      # ubuntu-latest ships Google Chrome. The gate's precondition test
      # fails rather than skips when CI has none, so a runner image that
      # drops it is loud instead of quietly turning the gate off.
      - name: Which Chrome the gate will drive
        run: google-chrome --version || chromium --version || true

      - name: M1 gate
        run: pnpm exec vitest run tests/gate --testTimeout=300000

  secrets:
    name: secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not a shallow clone: making the repository public
          # exposes every commit ever made, so a secret in an old commit is
          # just as damaging as one in HEAD.
          fetch-depth: 0

      # Pinned binary rather than a third-party action. The action wrapper adds
      # a supply-chain dependency to CI and carries licensing conditions for
      # organisation-owned repositories, so a pinned release keeps both the
      # version and the trust boundary explicit.
      #
      # The download is verified against the checksums file published with the
      # same release. That detects a corrupted or swapped artifact; it does not
      # defend against a compromised release itself, which no in-CI check can.
      # Pinning the version is what bounds that exposure.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"

          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"

          # Verify only our archive; the file lists every platform's build.
          grep " ${archive}\$" checksums.txt > expected.txt
          test -s expected.txt
          sha256sum --check expected.txt

          tar -xzf "$archive" gitleaks
          ./gitleaks version

      - name: Scan full history
        run: ./gitleaks detect --no-banner --redact --log-opts="--all"

  licenses:
    name: license allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Check dependency licenses
        run: node scripts/check-licenses.mjs

  clean-install:
    name: clean install (fresh machine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable corepack
        run: corepack enable

      # Deliberately NOT cached, and deliberately not reusing the dev
      # machine's state: this job answers "does it work for someone who is not
      # the author?", which is the one question a developer's laptop can never
      # answer honestly, because it already has every dependency installed.
      - name: Install from lockfile on a bare runner
        run: pnpm install --frozen-lockfile

      - name: Build from clean
        run: pnpm run build

      - name: Tests pass on a machine that has never run them
        run: pnpm run test

      # Scope note: this job currently proves install + build + test on a bare
      # runner. It is extended to install the packed CLI and run a real scan
      # against a fixture once the CLI has commands (BR-M0-11) and the fixture
      # harness exists (BR-M0-13). Extending it is part of BR-M1-31's gate.
      - name: Packable
        run: pnpm --filter @browserrecon/cli pack --pack-destination /tmp

  dependency-review:
    name: dependency review
    # PR-only: the action compares a PR's dependency changes against the base
    # branch, so there is nothing to diff on a direct push.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Review added or changed dependencies
        uses: actions/dependency-review-action@v4
        with:
          # The most common supply-chain vector is a small, useful-looking new
          # package, so any dependency change gets surfaced for explicit
          # attention rather than reviewed only if someone notices it.
          comment-summary-in-pr: on-failure
          fail-on-severity: low
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Unlicense, CC0-1.0
